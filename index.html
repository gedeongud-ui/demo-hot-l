<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système de Réservation - Tuto Complet</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; color: #333; }
        .etape { display: none; background: white; padding: 25px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .etape.active { display: block; }
        
        .choix-box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; cursor: pointer; background: #fff; }
        .choix-box:hover { border-color: #000; }
        .choix-box.occupee { border: 1px solid red; background: #ffeeee; opacity: 0.7; cursor: not-allowed; }
        
        .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-row input, .form-row select { padding: 10px; width: 180px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { background: #000; color: #fff; border: none; padding: 12px 20px; cursor: pointer; width: 100%; border-radius: 4px; margin-top: 10px; font-weight: bold; }
        button:hover { background: #333; }
        button:disabled { background: #999; cursor: not-allowed; }
        button.btn-retour { background: #ccc; color: #000; width: auto; margin-bottom: 20px; padding: 8px 15px; }
        
        .zone-photos { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .photo-placeholder { background: #ddd; padding: 20px; font-size: 12px; min-width: 80px; text-align: center; border-radius: 4px; border: 1px dashed #999; }
        
        .recu-box { border: 2px dashed #000; padding: 20px; text-align: left; background: #fffcf0; margin-bottom: 20px; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #1ebd5a; }
    </style>
</head>
<body>

    <!-- ÉTAPE 1 -->
    <div id="etape-1" class="etape active">
        <h2>Étape 1 : Que souhaitez-vous réserver ?</h2>
        <div class="choix-box" onclick="allerAEtape('etape-2')">
            <h3>🛏️ Hébergement</h3>
            <p>Réserver une chambre ou un appartement.</p>
        </div>
    </div>

    <!-- ÉTAPE 2 -->
    <div id="etape-2" class="etape">
        <button class="btn-retour" onclick="allerAEtape('etape-1')">← Retour</button>
        <h2>Étape 2 : Votre séjour</h2>
        
        <div class="form-row">
            <label>Date d'arrivée :</label>
            <input type="date" id="date-arrivee">
        </div>
        <div class="form-row">
            <label>Date de départ :</label>
            <input type="date" id="date-depart">
        </div>
        <hr style="margin: 20px 0; border-top: 1px solid #eee;">
        <div class="form-row">
            <label>Adultes :</label>
            <input type="number" id="nb-adultes" value="1" min="1">
        </div>
        <div class="form-row">
            <label>Enfants :</label>
            <input type="number" id="nb-enfants" value="0" min="0">
        </div>
        <button onclick="validerDatesEtPersonnes()">Voir les chambres disponibles</button>
    </div>

    <!-- ÉTAPE 3 -->
    <div id="etape-3" class="etape">
        <button class="btn-retour" onclick="allerAEtape('etape-2')">← Retour au calendrier</button>
        <h2>Étape 3 : Choisissez votre espace</h2>
        <p id="resume-recherche" style="color: #666; font-size: 0.9em; margin-bottom: 20px;"></p>
        <div id="liste-chambres"></div>
        <button class="btn-retour" onclick="reinitialiserSysteme()" style="margin-top:20px; background:red; color:white; width:100%;">[ADMIN] Libérer toutes les chambres</button>
    </div>

    <!-- ÉTAPE 4 -->
    <div id="etape-4" class="etape">
        <button class="btn-retour" onclick="allerAEtape('etape-3')">← Changer de chambre</button>
        <h2>Étape 4 : Paiement Mobile Money</h2>
        <div style="background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <p id="recap-paiement" style="margin: 0; line-height: 1.5;"></p>
        </div>
        
        <div class="form-row">
            <label>Votre Réseau :</label>
            <!-- L'événement onchange appelle notre nouvelle fonction -->
            <select id="reseau-momo" onchange="changerPrefixe()">
                <option value="MTN">MTN Mobile Money</option>
                <option value="Airtel">Airtel Money</option>
            </select>
        </div>
        <div class="form-row">
            <label>Numéro de compte :</label>
            <!-- Le placeholder par défaut est 06 -->
            <input type="text" id="numero-client" placeholder="Ex: 06 000 00 00">
        </div>
        <div class="form-row">
            <label>Validez la transaction :</label>
            <button onclick="simulerPaiementMomo()" style="width: auto;">Payer maintenant</button>
        </div>
    </div>

    <!-- ÉTAPE 5 -->
    <div id="etape-5" class="etape">
        <h2 style="color: green;">✅ Paiement Validé !</h2>
        <p>Votre chambre est désormais bloquée.</p>
        <div class="recu-box" id="recu-final"></div>
        <button class="btn-whatsapp" id="btn-envoyer-whatsapp">Envoyer mon reçu au Gérant (WhatsApp)</button>
        <button onclick="allerAEtape('etape-1')" style="margin-top: 15px; background: #666;">Faire une nouvelle réservation</button>
    </div>

    <script>
        // 1. Initialisation
        const chambresParDefaut = [
            { id: 'chambre_01', nom: 'Chambre Standard (Simple)', prix: 35000, statut: 'libre', photos: ['Lit', 'Douche'] },
            { id: 'app_01', nom: 'Appartement : 1 Chambre + Salon', prix: 60000, statut: 'libre', photos: ['Salon', 'Chambre'] },
            { id: 'app_02', nom: 'Appartement VIP : 2 Chambres', prix: 100000, statut: 'libre', photos: ['VIP', 'Piscine'] }
        ];

        let baseDeDonneesChambres = JSON.parse(localStorage.getItem('mesChambresHotes')) || chambresParDefaut;
        let reservation = { arrivee: '', depart: '', adultes: 1, enfants: 0, chambre: null, prixTotal: 0, codeTransaction: '' };

        function allerAEtape(idEtape) {
            document.querySelectorAll('.etape').forEach(el => el.classList.remove('active'));
            document.getElementById(idEtape).classList.add('active');
            if (idEtape === 'etape-3') afficherChambres();
        }

        function validerDatesEtPersonnes() {
            reservation.arrivee = document.getElementById('date-arrivee').value;
            reservation.depart = document.getElementById('date-depart').value;
            if(!reservation.arrivee || !reservation.depart) { alert("Veuillez choisir vos dates."); return; }
            allerAEtape('etape-3');
        }

        function afficherChambres() {
            const conteneur = document.getElementById('liste-chambres');
            conteneur.innerHTML = ''; 

            baseDeDonneesChambres.forEach(chambre => {
                let div = document.createElement('div');
                div.className = 'choix-box';
                let htmlPhotos = '<div class="zone-photos">' + chambre.photos.map(p => `<div class="photo-placeholder">${p}</div>`).join('') + '</div>';

                if (chambre.statut === 'occupee') {
                    div.classList.add('occupee');
                    div.innerHTML = `${htmlPhotos}<h3>${chambre.nom}</h3><button disabled>❌ Chambre Déjà Occupée</button>`;
                } else {
                    div.innerHTML = `${htmlPhotos}<h3>${chambre.nom}</h3><p><strong>${chambre.prix} FCFA / nuit</strong></p><button onclick="preparerPaiement('${chambre.id}')">Sélectionner cette chambre</button>`;
                }
                conteneur.appendChild(div);
            });
        }

        function preparerPaiement(idChambre) {
            reservation.chambre = baseDeDonneesChambres.find(ch => ch.id === idChambre);
            reservation.prixTotal = reservation.chambre.prix;
            document.getElementById('recap-paiement').innerHTML = `<strong>${reservation.chambre.nom}</strong> <br> Montant : ${reservation.prixTotal} FCFA`;
            
            // On s'assure que le bon préfixe est affiché selon le réseau choisi par défaut
            changerPrefixe();
            
            allerAEtape('etape-4');
        }

        // NOUVELLE FONCTION : Change le placeholder selon le réseau choisi
        function changerPrefixe() {
            let reseau = document.getElementById('reseau-momo').value;
            let champNumero = document.getElementById('numero-client');
            
            if (reseau === 'MTN') {
                champNumero.placeholder = "Ex: 06 000 00 00";
            } else if (reseau === 'Airtel') {
                champNumero.placeholder = "Ex: 05 000 00 00";
            }
        }

        function simulerPaiementMomo() {
            let numero = document.getElementById('numero-client').value;
            let reseau = document.getElementById('reseau-momo').value;
            
            if(!numero) { alert("Veuillez entrer votre numéro."); return; }
            
            // VERIFICATION DU PREFIXE 06 ou 05
            // On enlève les éventuels espaces pour bien vérifier
            let numeroPropre = numero.replace(/\s/g, ''); 
            
            if (reseau === 'MTN' && !numeroPropre.startsWith('06')) {
                alert("Erreur : Un numéro MTN doit commencer par 06.");
                return;
            }
            if (reseau === 'Airtel' && !numeroPropre.startsWith('05')) {
                alert("Erreur : Un numéro Airtel doit commencer par 05.");
                return;
            }

            // SIMULATION DU MESSAGE POP-UP SUR LE TÉLÉPHONE (USSD)
            let messageTelephone = `📱 SIMULATION TÉLÉPHONE (${reseau}) :\n\nVous êtes sur le point de valider un paiement de ${reservation.prixTotal} FCFA.\n\nCliquez sur "OK" pour simuler l'entrée de votre code PIN secret et valider.`;
            
            let validationUSSD = confirm(messageTelephone);
            
            if (validationUSSD) {
                // Paiement validé, on bloque la chambre
                let index = baseDeDonneesChambres.findIndex(ch => ch.id === reservation.chambre.id);
                baseDeDonneesChambres[index].statut = 'occupee'; 
                localStorage.setItem('mesChambresHotes', JSON.stringify(baseDeDonneesChambres));
                
                reservation.codeTransaction = "TXN-" + Math.floor(Math.random() * 1000000);
                
                document.getElementById('recu-final').innerHTML = `
                    <p><strong>Chambre:</strong> ${reservation.chambre.nom}</p>
                    <p><strong>Transaction:</strong> ${reservation.codeTransaction}</p>
                    <p><strong>Montant:</strong> ${reservation.prixTotal} FCFA</p>
                    <p><strong>Payé via:</strong> ${reseau} (${numero})</p>
                `;
                
                document.getElementById('btn-envoyer-whatsapp').onclick = function() {
                    let textMsg = encodeURIComponent(`Bonjour, voici mon reçu de réservation.\nTransaction: ${reservation.codeTransaction}\nChambre: ${reservation.chambre.nom}\nMontant: ${reservation.prixTotal} FCFA.\nNuméro de paiement: ${numero}`);
                    window.open(`https://wa.me/242068970968?text=${textMsg}`, '_blank');
                };

                allerAEtape('etape-5');
            } else {
                // Si l'utilisateur clique sur "Annuler"
                alert("❌ Opération annulée sur le téléphone.");
            }
        }

        function reinitialiserSysteme() {
            localStorage.removeItem('mesChambresHotes');
            baseDeDonneesChambres = chambresParDefaut;
            alert("Toutes les chambres sont de nouveau libres !");
            afficherChambres();
        }
    </script>
</body>
</html>
